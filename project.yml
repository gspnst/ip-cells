name: CellAnalyzer
options:
  bundleIdPrefix: com.ipcells
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  CellAnalyzerCore:
    path: Packages/CellAnalyzerCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID here (or in Xcode → Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  CellAnalyzer:
    type: application
    platform: iOS
    sources:
      - path: CellAnalyzer
    dependencies:
      - package: CellAnalyzerCore
      - sdk: CoreTelephony.framework
      - sdk: Vision.framework
    info:
      path: CellAnalyzer/Resources/Info.plist
      properties:
        CFBundleDisplayName: Cell Analyzer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: Cell Analyzer tags each measurement with your position so it can map coverage and estimate where cells are.
        NSLocationAlwaysAndWhenInUseUsageDescription: Allow background location to keep recording radio changes while the screen is off, for example during a drive test.
        NSPhotoLibraryUsageDescription: Cell Analyzer reads the Field Test Mode screenshots you pick to extract cell measurements.
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ipcells.CellAnalyzer
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets: []

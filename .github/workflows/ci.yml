name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
      - name: Test CellAnalyzerCore
        run: swift test --package-path Packages/CellAnalyzerCore

  ios:
    name: iOS app build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Test CellAnalyzerCore (macOS)
        run: swift test --package-path Packages/CellAnalyzerCore
      - name: Build app for iOS Simulator
        run: |
          status=0
          xcodebuild build \
            -project CellAnalyzer.xcodeproj \
            -scheme CellAnalyzer \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || status=$?
          grep -E "(error|warning):|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -300 || true
          exit $status
      - name: Show compiler errors
        if: failure()
        run: grep -E -A3 "error:" build.log | head -200 || true
      - name: UI smoke test (Simulator, demo data)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS" in k), reverse=True)
          print(next(d["udid"] for k in runtimes for d in devices[k] if d["name"].startswith("iPhone")))
          ')
          echo "Simulator: $UDID"
          status=0
          xcodebuild test \
            -project CellAnalyzer.xcodeproj \
            -scheme CellAnalyzer \
            -destination "id=$UDID" \
            -resultBundlePath TestResults.xcresult > uitest.log 2>&1 || status=$?
          grep -E "error:|Test Case|\*\* TEST" uitest.log | tail -40 || true
          mkdir -p screenshots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots || true
          ls screenshots
          exit $status
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: screenshots
          if-no-files-found: ignore
      - name: Build app for device (unsigned)
        run: |
          status=0
          xcodebuild build \
            -project CellAnalyzer.xcodeproj \
            -scheme CellAnalyzer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO > device.log 2>&1 || status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" device.log | sort -u | head -100 || true
          exit $status
